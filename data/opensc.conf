# OpenSC configuration for AVD4Linux DoD CAC / PIV Smart Card compatibility
app default {
    # PC/SC options
    reader_driver pcsc {
        # Shared mode allows concurrent access without exclusive locks
        pcsc_shared_mode = true;

        # Keep card connection alive without resets on disconnect/transaction end
        transaction_end_action = leave;
        reconnect_action = leave;
        disconnect_action = leave;
        enable_pinpad = false;

        # Limit command and response sizes to 255/256 bytes for USB CCID readers
        # (e.g. Alcor Micro AU9540) that falsely report extended APDU capability
        # causing CKR_DEVICE_ERROR on transfers exceeding 255 bytes
        max_send_size = 255;
        max_recv_size = 256;
    }

    framework pkcs15 {
        enable_pinpad = false;
        use_file_caching = true;
    }

    card_driver default {
        enable_pinpad = false;
        max_send_size = 255;
        max_recv_size = 256;
    }
}
