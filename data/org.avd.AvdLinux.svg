<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#004E8C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#0F1720"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>

  <!-- Base rounded icon background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Desktop Monitor / Screen frame -->
  <rect x="22" y="24" width="84" height="58" rx="8" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="26" y="28" width="76" height="50" rx="5" fill="url(#screen)"/>

  <!-- Stand -->
  <path d="M56 84 L52 98 L76 98 L72 84 Z" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="44" y="98" width="40" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Cloud silhouette inside screen -->
  <path d="M42 54 C42 48, 48 44, 54 45 C56 41, 62 38, 68 40 C74 38, 80 43, 80 48 C84 48, 88 52, 88 56 C88 61, 84 64, 79 64 L45 64 C39 64, 36 60, 37 55 C38 54, 40 54, 42 54 Z" fill="#00BCF2" fill-opacity="0.4"/>

  <!-- Smart Card Chip / Security Badge Overlay -->
  <g transform="translate(68, 56)">
    <!-- Shield / Card base -->
    <rect x="0" y="0" width="38" height="46" rx="6" fill="#1C355E" stroke="#50E6FF" stroke-width="2"/>
    <!-- Gold Microchip -->
    <rect x="8" y="10" width="22" height="18" rx="3" fill="url(#gold)"/>
    <!-- Chip contact lines -->
    <line x1="8" y1="19" x2="30" y2="19" stroke="#8B6914" stroke-width="1"/>
    <line x1="19" y1="10" x2="19" y2="28" stroke="#8B6914" stroke-width="1"/>
    <line x1="14" y1="10" x2="14" y2="28" stroke="#8B6914" stroke-width="1"/>
    <line x1="24" y1="10" x2="24" y2="28" stroke="#8B6914" stroke-width="1"/>
    <!-- Security checkmark / lock accent -->
    <circle cx="19" cy="37" r="4" fill="#00E676"/>
  </g>
</svg>
