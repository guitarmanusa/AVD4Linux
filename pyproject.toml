[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avd-linux"
version = "0.9.0"
description = "Native Linux client for Azure Virtual Desktop with DoD CAC / Smart Card Redirection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AVD for Linux Project" }
]
keywords = ["avd", "azure-virtual-desktop", "rdp", "smartcard", "cac", "piv", "dod", "freerdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Internet",
]
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
avd-linux = "avd_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]
