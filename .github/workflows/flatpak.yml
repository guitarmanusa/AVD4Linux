name: Build & Package Flatpak

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Flatpak Builder"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-util
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --pedantic data/org.avd4linux.AVD4Linux.metainfo.xml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.avd4linux.AVD4Linux.flatpak
          manifest-path: packaging/flatpak/org.avd4linux.AVD4Linux.yaml
          run-tests: false
          app-id: org.avd4linux.AVD4Linux

      - name: Upload Standalone Flatpak Bundle
        uses: actions/upload-artifact@v4
        with:
          name: org.avd4linux.AVD4Linux.flatpak
          path: org.avd4linux.AVD4Linux.flatpak

      - name: Attach Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: org.avd4linux.AVD4Linux.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
